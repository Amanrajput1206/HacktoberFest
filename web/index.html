<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #c2410c; --accent-soft: #fff1e8; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #a09f99; --line: #33322f;
      --accent: #fb923c; --accent-soft: #2a1d14; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  code, .mono { font-family: var(--mono); font-size: 0.92em; }
  a { color: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-top: 20px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .who { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .who strong { font-size: 20px; }
  .who .ids { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat .label { font-weight: 650; font-size: 15px; }
  .stat .sub { color: var(--muted); font-size: 13px; line-height: 1.35; min-height: 2.7em; }
  .stat .value { font-size: 28px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .stat.hot .value { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  tr.module { cursor: pointer; }
  tr.module:hover { background: var(--accent-soft); }
  tr.files td { padding: 0 10px 12px 28px; background: transparent; }
  .bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.orphan { background: var(--accent-soft); color: var(--accent); }
  .pill.none { color: var(--bad); }
  .dev { white-space: nowrap; }
  .dev::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    vertical-align: 1px; background: var(--good); }
  .dev.inactive { color: var(--muted); }
  .dev.inactive::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .legend { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
  .scroll { overflow-x: auto; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tabs button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--text); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .verified { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .verified .meter { width: 120px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .verified .meter div { height: 100%; background: var(--good); }
  .kt { max-width: 78ch; }
  .kt h1 { font-size: 22px; } .kt h2 { font-size: 19px; margin-top: 28px; } .kt h3 { font-size: 15px; margin: 20px 0 6px; }
  .kt a { color: var(--accent); }
  .kt table { margin: 8px 0; } .kt li { margin: 3px 0; }
  .kt ul:has(input[type=checkbox]) { list-style: none; padding-left: 4px; }
  .muted { color: var(--muted); }
  .error { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Handoff</h1>
    <p id="repo">Loading analysis…</p>
  </header>

  <section id="impact" hidden>
    <h2>If this person leaves</h2>
    <div class="who"><strong id="dev-name"></strong><span class="ids mono" id="dev-ids"></span></div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="modules" hidden>
    <h2>Code that loses its experts, ranked</h2>
    <p class="muted" style="margin-top:-6px">Click a module to see its files. Risk = importance of orphaned files + half that of at-risk files.
      <span class="legend"><span class="dev active">active (committed in the last 12 months)</span><span class="dev inactive">inactive</span></span></p>
    <div class="scroll"><table>
      <thead><tr><th>Module</th><th class="num">Risk</th><th></th><th class="num">Orphaned / at risk</th><th>Successor</th></tr></thead>
      <tbody id="module-rows"></tbody>
    </table></div>
  </section>

  <section id="kt-section" hidden>
    <h2>Knowledge-transfer plan</h2>
    <p id="kt-meta" class="muted"></p>
    <div class="tabs" id="kt-tabs" role="tablist"></div>
    <article class="kt" id="kt"></article>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => `${Math.round((x ?? 0) * 100)}%`;

function md(text) {
  const html = DOMPurify.sanitize(marked.parse(text || ""));
  const div = document.createElement("div");
  div.innerHTML = html;
  div.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  return div.innerHTML;
}

// Same rule as the successor logic: active = committed in the 12 months before the repo's latest commit.
function activity(a) {
  const ref = new Date(a.head_date || a.developers.map((d) => d.last_commit || "").sort().pop());
  const cutoff = ref.getTime() - 365 * 864e5;
  return (last) => Boolean(last) && new Date(last).getTime() >= cutoff;
}

function devTag(name, last, isActive) {
  const active = isActive(last);
  return `<span class="dev ${active ? "active" : "inactive"}"
      title="Last commit ${esc((last || "unknown").slice(0, 10))} (${active ? "active" : "inactive"})">${esc(name)}</span>`;
}

function stat(label, sub, value, hot) {
  return `<div class="stat${hot ? " hot" : ""}"><div class="label">${label}</div><div class="sub">${sub}</div>
      <div class="value">${value}</div></div>`;
}

function renderImpact(a, devs) {
  const dep = a.departure;
  const dev = devs[dep.dev];
  $("dev-name").textContent = dev.names[0];
  const others = [...dev.names.slice(1), ...dev.emails];
  $("dev-ids").textContent = `${dep.dev} · ${dev.commits ?? "?"} commits` + (others.length ? ` · merged identities: ${others.join(", ")}` : "");
  $("stats").innerHTML = [
    stat("Orphaned", "Files that lose their only expert", dep.orphaned_files, true),
    stat("At risk", "Files where they are an author", dep.at_risk_files),
    stat("File coverage", "Files that still have an expert", `${pct(dep.coverage_before)} <small>→</small> ${pct(dep.coverage_after)}`, true),
    stat("Truck factor", "People who can leave before half the code has no expert", `${a.truck_factor.value} <small>→</small> ${dep.truck_factor_after}`, true),
  ].join("");
  $("impact").hidden = false;
}

function renderModules(a, devs) {
  const isActive = activity(a);
  const tag = (id) => devTag(devs[id]?.names[0] ?? id, devs[id]?.last_commit, isActive);
  const top = Math.max(...a.modules.map((m) => m.risk), 0) || 1;
  const rows = a.modules.map((m, i) => {
    const succ = m.successor ? tag(m.successor.dev) : `<span class="pill none">none</span>`;
    const files = m.files.map((f) => `<tr>
        <td class="mono">${esc(f.path)} ${f.orphaned ? '<span class="pill orphan">orphaned</span>' : ""}</td>
        <td class="num">${f.importance.toFixed(2)}</td><td class="num">${f.loc}</td><td class="num">${f.fan_in}</td>
        <td>${f.authors.map(tag).join(", ")}</td></tr>`).join("");
    return `<tr class="module" data-i="${i}">
        <td class="mono">${esc(m.path)}</td>
        <td class="num">${m.risk.toFixed(2)}</td>
        <td style="width:28%"><div class="bar" style="width:${(m.risk / top) * 100}%"></div></td>
        <td class="num">${m.orphaned_files ?? "?"} / ${m.at_risk_files ?? m.files.length}</td>
        <td>${succ}</td></tr>
      <tr class="files" id="files-${i}" hidden><td colspan="5"><table>
        <thead><tr><th>File</th><th class="num">Importance</th><th class="num">LOC</th><th class="num">Fan-in</th><th>Authors</th></tr></thead>
        <tbody>${files}</tbody></table></td></tr>`;
  }).join("");
  $("module-rows").innerHTML = rows || `<tr><td colspan="5" class="muted">No at-risk modules.</td></tr>`;
  $("module-rows").addEventListener("click", (e) => {
    const tr = e.target.closest("tr.module");
    if (tr) { const row = $(`files-${tr.dataset.i}`); row.hidden = !row.hidden; }
  });
  $("modules").hidden = false;
}

function renderKt(kt) {
  const rate = kt.claims_total ? kt.claims_verified / kt.claims_total : 0;
  $("kt-meta").innerHTML = `<span class="verified">${kt.claims_verified} / ${kt.claims_total} claims verified
      <span class="meter"><div style="width:${rate * 100}%"></div></span></span>
      · model <code>${esc(kt.model)}</code> · prompt ${esc(kt.prompt_version)}`;
  const views = [{ label: "Full plan", markdown: kt.markdown }, ...kt.modules.map((m) => ({
    label: `${m.path} (${m.claims_verified}/${m.claims_total})`, markdown: m.markdown }))];
  const show = (i) => {
    $("kt").innerHTML = md(views[i].markdown);
    [...$("kt-tabs").children].forEach((b, j) => b.setAttribute("aria-selected", String(i === j)));
  };
  $("kt-tabs").innerHTML = views.map((v, i) => `<button role="tab" data-i="${i}">${esc(v.label)}</button>`).join("");
  $("kt-tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); });
  show(0);
}

async function main() {
  let a;
  try {
    const r = await fetch("/api/analysis");
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    a = await r.json();
  } catch (e) {
    $("repo").innerHTML = `<span class="error">Could not load analysis: ${esc(e.message)}</span>`;
    return;
  }
  const devs = Object.fromEntries(a.developers.map((d) => [d.id, d]));
  $("repo").innerHTML = `<a href="https://github.com/${esc(a.repo)}" target="_blank" rel="noopener">${esc(a.repo)}</a>
      at <code>${esc(a.head.slice(0, 8))}</code> · ${a.developers.length} developers · truck factor ${a.truck_factor.value}`;
  if (!a.departure) {
    $("repo").innerHTML += ` · <span class="muted">run <code>handoff analyze --who …</code> for departure impact</span>`;
    return;
  }
  renderImpact(a, devs);
  renderModules(a, devs);

  $("kt-section").hidden = false;
  const r = await fetch(`/api/kt/${encodeURIComponent(a.departure.dev)}`);
  if (r.ok) renderKt(await r.json());
  else $("kt-meta").innerHTML = `Not generated yet. Run <code>handoff kt &lt;repo&gt; --who ${esc(a.departure.dev)}</code>.`;
}
main();
</script>
</body>
</html>
