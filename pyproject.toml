[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.1.0"
description = "Knowledge-transfer plans for departing open-source maintainers, from Git history."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
handoff = "handoff.cli:app"

[tool.setuptools]
packages = ["handoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
